[package]
name = "herdr-claude-memories"
version = "0.1.0"
edition = "2021"
description = "Surface and curate Claude Code auto-memory from inside herdr"
license = "MIT"
repository = "https://github.com/StGerman/herdr-claude-memories"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
